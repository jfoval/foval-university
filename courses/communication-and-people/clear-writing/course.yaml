id: clear-writing
title: Writing Clearly
school: communication-and-people
subject: Humanities
level: All levels
status: review
summary: >-
  Write emails, essays, and reports that people actually read and understand. Practical techniques,
  not grammar drills.
description: >-
  Clear writing is clear thinking made visible. This short course teaches the handful of techniques
  that separate writing people finish from writing they abandon: leading with the point, choosing
  concrete words, building sentences that move, and editing ruthlessly. Every lesson has
  before-and-after examples and a rewriting exercise.
outcomes:
  - Put the main point first, in any document
  - Cut words that do no work
  - Prefer concrete, specific language over abstraction
  - Control sentence length and rhythm
  - Structure paragraphs and documents so readers can skim
  - Edit your own drafts with a repeatable checklist
prerequisites: []
estimated_hours: 1.6
